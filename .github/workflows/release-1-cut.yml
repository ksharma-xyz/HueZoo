name: "1. Cut Release Branch"

# Manual workflow to kick off a release cycle.
#
# Reads the current versionName from main's build.gradle.kts and:
#   1. Creates prod/{version} from the base branch
#   2. Immediately bumps versionName on main to the next version
#      so development on main is always ahead of what's in the release branch.
#
# Flow:
#   main (1.0.0) → prod/1.0.0 created, main bumped to 1.1.0
#   → Pushing prod/1.0.0 automatically triggers release-2-deploy-rc.yml
#     which builds, tags v1.0.0-RC1, and distributes to GP Internal + TestFlight.
#
# Usage: Actions → 1. Cut Release Branch → Run workflow

on:
  workflow_dispatch:
    inputs:
      base-branch:
        description: 'Branch to cut release from'
        required: true
        default: 'main'
        type: string
      next-version:
        description: 'Version to set on main after cutting (e.g. 1.2.0). Leave blank to auto-increment minor.'
        required: false
        type: string

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base-branch }}
          token: ${{ secrets.PAT_HUEZOO_GITHUB }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Read versionName from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP '(?<=versionName = ")[^"]+' androidApp/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from androidApp/build.gradle.kts"
            exit 1
          fi
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "::notice::Detected version: ${VERSION} — will create prod/${VERSION}"

      # Android and iOS must agree before we cut, or the release ships two
      # different version numbers to the two stores.
      - name: Verify iOS marketing version matches Android
        run: |
          set -e
          IOS=$(grep -oP '(?<=^MARKETING_VERSION=).*' iosApp/Configuration/Config.xcconfig | tr -d '[:space:]')
          ANDROID="${{ steps.version.outputs.name }}"
          if [ "$IOS" != "$ANDROID" ]; then
            echo "::error::Version mismatch — Android is ${ANDROID}, iOS MARKETING_VERSION is ${IOS:-<unset>}. Fix iosApp/Configuration/Config.xcconfig before cutting."
            exit 1
          fi
          echo "::notice::Both platforms at ${ANDROID}"

      - name: Check branch does not already exist
        run: |
          if git ls-remote --exit-code --heads origin "prod/${{ steps.version.outputs.name }}" > /dev/null 2>&1; then
            echo "::error::Branch prod/${{ steps.version.outputs.name }} already exists."
            exit 1
          fi

      - name: Create and push release branch
        run: |
          git checkout -b "prod/${{ steps.version.outputs.name }}"
          git push origin "prod/${{ steps.version.outputs.name }}"

          # main's HEAD always carries `[skip ci]` from the previous cut's main-bump commit
          # (we use [skip ci] there to avoid running main's CI for a version-only change).
          # That `[skip ci]` propagates to the prod branch's HEAD and silently skips
          # release-2-deploy-rc.yml on this push. Add a fresh empty commit so the
          # workflow always fires for RC1.
          git commit --allow-empty -m "chore: kick off RC build for prod/${{ steps.version.outputs.name }}"
          git push origin "prod/${{ steps.version.outputs.name }}"

          echo "::notice::Created prod/${{ steps.version.outputs.name }} — release-2-deploy-rc.yml will now build RC1"

      # ── Bump version on main immediately after cutting the release branch ───────
      # main always carries the *next* version so new PRs merged to main never
      # accidentally share a versionName with an in-flight release branch.

      - name: Compute next version
        id: next
        run: |
          SUPPLIED="${{ inputs.next-version }}"
          if [ -n "$SUPPLIED" ]; then
            NEXT="$SUPPLIED"
          else
            CURRENT="${{ steps.version.outputs.name }}"
            MAJOR=$(echo "$CURRENT" | cut -d. -f1)
            MINOR=$(echo "$CURRENT" | cut -d. -f2)
            NEXT="${MAJOR}.$((MINOR + 1)).0"
          fi
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "::notice::Bumping main to ${NEXT}"

      - name: Switch to main for version bump
        run: git checkout main

      - name: Bump versionName in build.gradle.kts
        run: |
          sed -i 's/versionName = "[^"]*"/versionName = "${{ steps.next.outputs.next }}"/' androidApp/build.gradle.kts
          grep "versionName" androidApp/build.gradle.kts

      # MARKETING_VERSION in Config.xcconfig is the ONLY iOS version that ships.
      # Fastfile#build_release reads it from here and passes it via xcargs, and the
      # project sets GENERATE_INFOPLIST_FILE = YES — so Info.plist is regenerated
      # from build settings at archive time and its on-disk value is never used.
      # Info.plist holds $(MARKETING_VERSION) and needs no bump.
      #
      # Hard-fail rather than warn: a silent skip here is exactly how iOS sat at
      # 1.2.0 through the 1.3.0 and 1.4.0 releases.
      - name: Bump MARKETING_VERSION in Config.xcconfig
        run: |
          set -e
          FILE="iosApp/Configuration/Config.xcconfig"
          if ! grep -q '^MARKETING_VERSION=' "$FILE"; then
            echo "::error::MARKETING_VERSION not found in ${FILE}. iOS releases would ship the wrong version — aborting."
            exit 1
          fi
          sed -i 's/^MARKETING_VERSION=.*/MARKETING_VERSION=${{ steps.next.outputs.next }}/' "$FILE"
          grep '^MARKETING_VERSION=' "$FILE"

      - name: Commit and push version bump to main
        run: |
          git add androidApp/build.gradle.kts iosApp/Configuration/Config.xcconfig
          if git diff --staged --quiet; then
            echo "No changes to commit — main may already be at ${{ steps.next.outputs.next }}"
          else
            git commit -m "chore: bump version to ${{ steps.next.outputs.next }} [skip ci]"
            git push origin main
          fi
